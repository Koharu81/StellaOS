set timeout=3
set default=0

# Set framebuffer mode
set gfxmode=1280x720x32
set gfxpayload=keep

# Enable graphics
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "StellaOS ★ - Boot" --class os {
    multiboot2 /boot/stella.bin
    boot
}

menuentry "StellaOS ★ - Safe Mode" --class os {
    multiboot2 /boot/stella.bin safemode
    boot
}

menuentry "StellaOS ★ - Debug Mode" --class os {
    multiboot2 /boot/stella.bin debug
    boot
}
